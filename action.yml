name: Post Issue Comment
author: Alexander Thoukydides
description: Post a comment to an issue and minimise any previously added comments (as OUTDATED)
branding:
  icon: 'at-sign'
  color: 'blue'

inputs:
  issue_number:
    description: The GitHub issue to comment on
    required: true
    type: number
  body:
    description: The comment body to add
    required: true
    type: string
  marker:
    description: A prefix for the comment body, used to identify previous comments to be minimised
    type: string
    default: '<!-- bot-comment -->'

runs:
  using: composite

  steps:
    - name: Post the comment and minimise previous comments
      uses: actions/github-script@v7
      with:
        script: | # javascript
          const fn = require('${{ github.action_path }}/dist/index.js');
          return await fn(github);